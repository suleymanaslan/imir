[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imir"
version = "0.1.0"
description = "Image-instructed all-in-one image restoration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<3", "diffusers==0.37.0", "transformers==4.57.6",
  "peft==0.18.1", "accelerate==1.12.0", "safetensors==0.7.0",
  "huggingface-hub>=0.34,<1", "Pillow>=10", "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build"]

[project.scripts]
imir = "imir.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel.shared-data]
"NOTICE" = "share/imir/NOTICE"
"third_party/APACHE-2.0.txt" = "share/imir/licenses/APACHE-2.0.txt"
